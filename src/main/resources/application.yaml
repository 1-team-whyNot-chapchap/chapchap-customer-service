server:
  port: ${APP_PORT:8084}

spring:
  application:
    name: chapchap-customer-service
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:customer_db}
    username: ${DB_USER:chapchap}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

customer:
  storage:
    knowledge:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_KNOWLEDGE_BUCKET:customer-knowledge}
      presigned-get-url-expiry-seconds: ${MINIO_KNOWLEDGE_PRESIGNED_GET_URL_EXPIRY_SECONDS:300}
    quality-inquiry:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_QUALITY_INQUIRY_BUCKET:customer-quality}
  knowledge:
    activation-scheduler:
      enabled: ${KNOWLEDGE_ACTIVATION_SCHEDULER_ENABLED:true}
      fixed-delay: ${KNOWLEDGE_ACTIVATION_SCHEDULER_FIXED_DELAY:60000}
  ai:
    internal-auth:
      enabled: ${CUSTOMER_AI_INTERNAL_AUTH_ENABLED:false}
      auth-base-url: ${AUTH_SERVICE_BASE_URL:https://auth-service}
      token-path: ${AUTH_SERVICE_TOKEN_PATH:/internal/v1/service-tokens}
      client-id: ${AUTH_CUSTOMER_SERVICE_CLIENT_ID:customer-service}
      client-secret: ${AUTH_CUSTOMER_SERVICE_CLIENT_SECRET:}
      audience: ${AUTH_CUSTOMER_SERVICE_AUDIENCE:chapchap-customer-ai}
      scope: ${AUTH_CUSTOMER_SERVICE_SCOPE:customer-ai.invoke}
      subject-key-id: ${CUSTOMER_AI_SUBJECT_KEY_ID:customer-subject-1}
      subject-private-key-pem: ${CUSTOMER_AI_SUBJECT_PRIVATE_KEY_PEM:}
      subject-public-key-pem: ${CUSTOMER_AI_SUBJECT_PUBLIC_KEY_PEM:}
      subject-lifetime-seconds: ${CUSTOMER_AI_SUBJECT_LIFETIME_SECONDS:60}
      connect-timeout-milliseconds: ${AUTH_SERVICE_CONNECT_TIMEOUT_MILLISECONDS:1000}
      read-timeout-milliseconds: ${AUTH_SERVICE_READ_TIMEOUT_MILLISECONDS:3000}
    callback-auth:
      enabled: ${CUSTOMER_AI_CALLBACK_AUTH_ENABLED:false}
      jwks-url: ${AUTH_SERVICE_JWKS_URL:https://auth-service/.well-known/jwks.json}
      issuer: ${CUSTOMER_AI_CALLBACK_ISSUER:chapchap-auth-service}
      audience: ${CUSTOMER_AI_CALLBACK_AUDIENCE:chapchap-customer-service}
      subject: ${CUSTOMER_AI_CALLBACK_SUBJECT:customer-ai}
      scope: ${CUSTOMER_AI_CALLBACK_SCOPE:customer-ai.callback}
      maximum-lifetime-seconds: ${CUSTOMER_AI_CALLBACK_MAXIMUM_LIFETIME_SECONDS:300}
      jwks-cache-seconds: ${AUTH_SERVICE_JWKS_CACHE_SECONDS:300}
      connect-timeout-milliseconds: ${AUTH_SERVICE_JWKS_CONNECT_TIMEOUT_MILLISECONDS:1000}
      read-timeout-milliseconds: ${AUTH_SERVICE_JWKS_READ_TIMEOUT_MILLISECONDS:3000}
    knowledge-processing:
      base-url: ${CUSTOMER_AI_BASE_URL:http://localhost:8085}
      connect-timeout-milliseconds: ${CUSTOMER_AI_CONNECT_TIMEOUT_MILLISECONDS:1000}
      read-timeout-milliseconds: ${CUSTOMER_AI_READ_TIMEOUT_MILLISECONDS:10000}
  kafka:
    topics:
      payment: subscription.payment-events.v1
      refund: subscription.refund-events.v1
      subscription-notification: subscription.customer-notification-events.v1
      subscription: subscription.subscription-events.v1
      delivery-address: subscription.delivery-address-events.v1
      delivery: delivery.delivery-events.v1
      delivery-operation-notification: delivery.operation-notification-requests.v1
    groups:
      payment: customer-service-payment-group
      refund: customer-service-refund-group
      subscription-notification: customer-service-subscription-notification-group
      subscription: customer-service-subscription-group
      delivery-address: customer-service-delivery-address-group
      delivery: customer-service-delivery-group
      delivery-operation-notification: customer-service-delivery-operation-notification-group

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs

logging:
  level:
    root: info
    com.chapchap.customer: info
