spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  kafka:
    listener:
      auto-startup: false

customer:
  storage:
    knowledge:
      endpoint: http://localhost:9000
      access-key: test-access-key
      secret-key: test-secret-key
      bucket: customer-knowledge-test
      presigned-get-url-expiry-seconds: 300
  knowledge:
    activation-scheduler:
      enabled: false
  ai:
    knowledge-processing:
      base-url: http://localhost:8085
      service-token: test-customer-ai-service-token
      connect-timeout-milliseconds: 1000
      read-timeout-milliseconds: 10000
  kafka:
    topics:
      payment: subscription.payment-events.v1
      refund: subscription.refund-events.v1
      subscription-notification: subscription.customer-notification-events.v1
      subscription: subscription.subscription-events.v1
      delivery-address: subscription.delivery-address-events.v1
      delivery: delivery.delivery-events.v1
      delivery-operation-notification: delivery.operation-notification-requests.v1
    groups:
      payment: customer-service-payment-group
      refund: customer-service-refund-group
      subscription-notification: customer-service-subscription-notification-group
      subscription: customer-service-subscription-group
      delivery-address: customer-service-delivery-address-group
      delivery: customer-service-delivery-group
      delivery-operation-notification: customer-service-delivery-operation-notification-group
