services:
  customer-service:
    profiles: [app]
    build: .
    image: chapchap-customer-service:local
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_PORT: "8084"
      AUTH_SERVICE_URI: ${COMPOSE_AUTH_SERVICE_URI:-http://host.docker.internal:8081}
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: customer_db
      DB_USER: chapchap
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: ${COMPOSE_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      MINIO_ENDPOINT: ${COMPOSE_MINIO_ENDPOINT:-http://host.docker.internal:9000}
    ports:
      - "127.0.0.1:${APP_PORT:-8084}:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - backend
    restart: unless-stopped
    stop_grace_period: 30s

  mysql:
    image: mysql:8.4
    container_name: chapchap-customer-mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_DATABASE: customer_db
      MYSQL_USER: chapchap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - customer_mysql_data:/var/lib/mysql

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  customer_mysql_data:

networks:
  backend:
    external: true
    name: ${CHAPCHAP_NETWORK:-chapchap-network}
