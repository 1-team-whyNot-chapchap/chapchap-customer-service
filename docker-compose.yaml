services:
  mysql:
    image: mysql:8.4
    container_name: chapchap-customer-mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_DATABASE: customer_db
      MYSQL_USER: chapchap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - customer_mysql_data:/var/lib/mysql

    restart: unless-stopped

volumes:
  customer_mysql_data:
